plaky_field_keys:
  engineer: person-1
  qa: person-2
  repo: tag-2
  github_repos: tag-2
# Leads/managers never auto-assigned as PR QA REVIEWER. Keyed on GitHub login (stable,
# unambiguous) rather than display name. This does NOT block them from the developer/
# Assignee column -- when one of these people submits a PR themselves, they still get
# written in as the Plaky assignee like anyone else; they're only barred from being
# picked as somebody else's reviewer.
qa_excluded:
- jrb00013  # Joe Black
- austinm2h35-sketch  # Austin Heitzman
- devcodesfr  # Devin Gamble
- SeanSan06  # Sean San
- Nathan-123  # Nathan Adams
# Added per Joe's PR #81 review (leads/managers on the support team, never PR QA):
- asheenhameeda8-cpu  # Asheen Hameeda
- AndyN-star
- Dpoin23  # David Poindexter
# 2026-09: specific individual exclusions (not lead/manager-team-derived).
- RiccoWrld  # Ricardo Beale
- christiankrider1  # Christian Krider
- ConnorWhite9  # Connor White
- CherryQuartzio  # Quang Nguyen
# Auto-excluded from QA on top of the above: live membership of these GitHub org teams
# (leads/managers by construction) -- add/remove someone on the team and it takes effect
# on the next roster load, no YAML edit needed. See settings.github_qa_excluded_teams.
qa_excluded_github_teams:
- Team-Deepiri/it-management-team

member_defaults:
  roles:
  - engineer
  - qa
  qa_tier: 3
  tier: standard
  repo_globs:
  # Team-Deepiri is the real org; deepiri-org is a legacy alias still used by some config.
  - Team-Deepiri/*
  - deepiri-org/*
  weight: 1.0
member_overrides:
  # GitHub login -> explicit Plaky user id (used when the identity matcher can't
  # bridge the accounts, e.g. login and Plaky email share nothing).
  Blasted-ctrl:
    id: '481106'   # Ali Ferris (aliferris2006@gmail.com)
    roles:
    - engineer
    - qa
    qa_tier: 3
members_fallback_only: true   # members: below is a FALLBACK; live GitHub roster wins
# FALLBACK roster only. The live Team-Deepiri/support-team GitHub team is the source of
# truth; this list is used ONLY when that API call fails (PAT lacking org read, token
# pending org approval, GitHub outage) so QA assignment never goes dark.
# Plaky ids came from the identity matcher's own auto-match against the workspace.
