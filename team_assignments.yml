hardware_tiers:
  light:
    weight_bias: 0.75
  standard:
    weight_bias: 1.0
  heavy:
    weight_bias: 1.15
repo_requirements:
  heavy_repo_patterns:
  - '*emotion*'
  - '*gpu*'
  - '*cuda*'
selection:
  random_jitter: 0.12
ambiguous_pr:
  enabled: true   # orphan PRs become real, linked tasks on the repo's routed board
  triage_board_id: ''
  triage_group_id: ''
  assign_qa: true
  title_template: "Triage: PR #{number} \u2014 {repo}"
