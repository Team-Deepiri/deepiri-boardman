# Repo → Plaky placement (API: Board -> Group -> Item). There is no separate "table" in the API.
# Keys: GitHub full name owner/repo
#
# defaults:
#   plaky_board_id: "..."   # optional; else PLAKY_DEFAULT_BOARD_ID
#   plaky_group_id: "..."   # optional; else PLAKY_DEFAULT_GROUP_ID
#   plaky_table: "Backlog"  # optional human label for issue/scan footers only
#
# repos:
#   org/repo:
#     category: backend
#     plaky_board_id: "..."
#     plaky_group_id: "..."

# deepiri-boardman routes to the "Bots" board, group "deepiri-boardman" (per Ali,
# Aug 12: "use the deepiri-boardman in the bots box, not the deepiri-boardman box").
# The old pin (269031 "deepiri-boardman" / 907471 "Open PRs") was the demo board.
# Field keys differ per board (Assignee person-5, QA person-6, Status status-8 here) —
# resolution is schema-driven, and sync_team_assignment_field_keys_from_board realigns
# team_assignments keys on first write.
repos:
  Team-Deepiri/deepiri-boardman:
    category: devtools
    plaky_board_id: "269028"
    plaky_group_id: "933385"
    plaky_table: "deepiri-boardman"
