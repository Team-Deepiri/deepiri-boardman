name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    timeout-minutes: 20
    name: Python lint
    runs-on: ubuntu-latest
    env:
      BOARDMAN_AI_LIVE: "0"
      BOARDMAN_STACK_BENCHMARK: "0"
      PLAKY_PR_WORKFLOW_LIVE: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run Ruff lint
        run: poetry run ruff check .

      - name: Check formatting with Black
        run: poetry run black --check .

  python:
    timeout-minutes: 20
    name: Python (Poetry, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      BOARDMAN_AI_LIVE: "0"
      BOARDMAN_STACK_BENCHMARK: "0"
      PLAKY_PR_WORKFLOW_LIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest

  node:
    timeout-minutes: 20
    name: Node (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UI
            working-directory: boardman-ui
            cache-dependency-path: boardman-ui/package-lock.json
          - name: Worker
            working-directory: worker
            cache-dependency-path: worker/package-lock.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: every wrangler release in range (4.120.0 included) declares
          # engines.node >=22, so running the worker job on 20 makes `npm ci` emit
          # EBADENGINE against an unsupported engine on every run.
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.cache-dependency-path }}

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run lint script if present
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint --if-present

      - name: Run tests if present
        working-directory: ${{ matrix.working-directory }}
        run: npm run test --if-present

      - name: Run build script if present
        working-directory: ${{ matrix.working-directory }}
        run: npm run build --if-present

      - name: Type-check Worker
        if: matrix.working-directory == 'worker'
        working-directory: worker
        run: npx tsc --noEmit

  docker:
    timeout-minutes: 20
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --file Dockerfile --tag deepiri-boardman:ci .

      - name: Build nginx UI image
        run: docker build --file deploy/nginx/Dockerfile --tag deepiri-boardman-ui:ci .

      # The vhosts are include fragments for the VPS's own nginx, so nothing else in
      # CI ever parses them. Run the real nginx -t over both, using the production
      # nginx image that was just built, so a broken vhost cannot merge green.
      # scripts/validate_nginx_conf.sh --render substitutes only the VPS-specific
      # bits (Let's Encrypt paths, privileged ports, the docker-internal upstream).
      # Mounting the render dir at the same absolute path keeps those substitutions
      # valid inside the container.
      - name: nginx -t on the deploy/nginx vhosts
        run: |
          render="$RUNNER_TEMP/nginx-render"
          bash scripts/validate_nginx_conf.sh --render "$render"
          docker run --rm \
            --volume "$render:$render" \
            --env "RENDER=$render" \
            deepiri-boardman-ui:ci \
            sh -c 'set -e
              for c in "$RENDER"/*/nginx.conf; do
                echo "--- nginx -t $c"
                nginx -t -c "$c" -p "$(dirname "$c")"
              done'

      # deploy/nginx uses `http2 on`, which needs nginx >= 1.25.1. The Ubuntu
      # runner ships 1.24.0, which rejects it as an unknown directive -- that
      # says nothing about the vhost, only that the runner is too old to check it.
      # Install nginx from nginx.org so the live check runs for real against the
      # same version production uses, instead of skipping (status 77).
      - name: Install nginx >= 1.25.1 for the live check
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl -fsSL https://nginx.org/keys/nginx_signing.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/nginx-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu $(lsb_release -cs) nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx
          nginx -v

      # nginx -t only proves the file parses. Boot the public vhost behind a stub
      # backend and make real requests, so the allowlist is verified to actually
      # route: if `location = /api/v1/webhooks/github` ever lost precedence to the
      # catch-all, every GitHub delivery would 403 while still passing -t.
      - name: Live-check the public vhost allowlist
        run: |
          set -euo pipefail
          bash scripts/validate_nginx_conf.sh --live deploy/nginx/boardman.deepiri.com.conf
