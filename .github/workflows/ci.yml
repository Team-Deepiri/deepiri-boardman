name: CI

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    timeout-minutes: 20
    name: Python lint
    runs-on: ubuntu-latest
    env:
      BOARDMAN_AI_LIVE: "0"
      BOARDMAN_STACK_BENCHMARK: "0"
      PLAKY_PR_WORKFLOW_LIVE: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run Ruff lint
        run: poetry run ruff check .

      - name: Check formatting with Black
        run: poetry run black --check .

  python:
    timeout-minutes: 20
    name: Python (Poetry, ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      BOARDMAN_AI_LIVE: "0"
      BOARDMAN_STACK_BENCHMARK: "0"
      PLAKY_PR_WORKFLOW_LIVE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==2.2.1"

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest

  node:
    timeout-minutes: 20
    name: Node (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: UI
            working-directory: boardman-ui
            cache-dependency-path: boardman-ui/package-lock.json
          - name: Worker
            working-directory: worker
            cache-dependency-path: worker/package-lock.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.cache-dependency-path }}

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: npm ci

      - name: Run lint script if present
        working-directory: ${{ matrix.working-directory }}
        run: npm run lint --if-present

      - name: Run tests if present
        working-directory: ${{ matrix.working-directory }}
        run: npm run test --if-present

      - name: Run build script if present
        working-directory: ${{ matrix.working-directory }}
        run: npm run build --if-present

      - name: Type-check Worker
        if: matrix.working-directory == 'worker'
        working-directory: worker
        run: npx tsc --noEmit

  docker:
    timeout-minutes: 20
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build backend image
        run: docker build --file Dockerfile --tag deepiri-boardman:ci .

      - name: Build nginx UI image
        run: docker build --file deploy/nginx/Dockerfile --tag deepiri-boardman-ui:ci .
