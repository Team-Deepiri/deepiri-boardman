name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run gitleaks (OSS binary, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c - >/dev/null
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            LOG_OPTS="--all"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch origin "${BASE_SHA}" --quiet || true
            LOG_OPTS="${BASE_SHA}..HEAD"
          else
            git fetch origin main --quiet || true
            LOG_OPTS="origin/main..HEAD"
          fi

          gitleaks git --log-opts="${LOG_OPTS}" --redact \
            --report-format=json --report-path="${GITHUB_WORKSPACE}/gitleaks-report.json"
