# Route for boardman.deepiri.com — add this as a new server block on the nginx
# ALREADY RUNNING on the VPS (ports 80/443 taken by deepiri-platform's own nginx
# container) rather than standing up a second nginx. No UI here on purpose — this
# proxies to Boardman's API only (webhooks + the Worker's pick-qa), matching "no chat UI on
# this box". Only an explicit allowlist of API paths is public here — see PUBLIC SURFACE below.
#
# PUBLIC SURFACE: only the API paths listed in the `location =` blocks below are
# reachable through this vhost. The catch-all `location /api/` returns 403 instead
# of proxying the whole tree, because this vhost is the box's public entry point and
# no UI is served here. To expose a new endpoint intentionally, add an explicit
# `location =` block for it — do not widen the catch-all. (The separate
# deploy/nginx/default.conf vhost, which does serve boardman-ui on :8088, keeps
# proxying all of /api/ because the SPA genuinely needs it; that vhost is for the
# UI's own network, not the internet.)
#
# How to wire it in:
#   1. Add this file's `server {}` block into the existing nginx's config (either a
#      new `include`'d file, or appended to its main config).
#   2. Add a Boardman container to the SAME docker network the existing nginx uses,
#      bound to 127.0.0.1 only (docker-compose.prod.yml's `boardman` service already
#      does this for its own compose network — just needs to be reachable from the
#      platform's nginx container, e.g. via an external network attach, or run the
#      nginx `proxy_pass` against the docker-internal service name if both stacks
#      share a network).
#   3. In Cloudflare: add an A/CNAME record for `boardman.deepiri.com` -> this VPS's
#      IP (proxied through Cloudflare is fine; the cert below is Let's Encrypt via the
#      box's own certbot — Cloudflare's "Full (strict)" SSL mode expects that).
#   4. Get a cert for the new hostname (the existing certbot container can request an
#      additional cert; run `certbot certonly --webroot -w /var/www/certbot -d
#      boardman.deepiri.com` against the running certbot container, then point
#      ssl_certificate below at that cert instead of the platform's shared one).
#   5. Register the GitHub webhook at https://boardman.deepiri.com/api/v1/webhooks/github
#      with the GITHUB_WEBHOOK_SECRET from Boardman's own .env.

upstream boardman_api {
    # Docker-internal name from Boardman's own compose file — reachable here once
    # both stacks are on a shared network (or replace with the host port Boardman's
    # container is published on, if not sharing a network).
    server boardman:8090;
}

server {
    listen 80;
    server_name boardman.deepiri.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name boardman.deepiri.com;

    # Separate cert for this hostname — see step 4 above. Do not point this at the
    # platform's own cert; Let's Encrypt certs are issued per hostname (or as a SAN
    # list decided up front), not shared implicitly across server_names.
    ssl_certificate     /etc/letsencrypt/live/boardman.deepiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boardman.deepiri.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location = /health {
        proxy_pass http://boardman_api/api/v1/health;
        access_log off;
    }

    # --- Public API surface: an explicit allowlist ---------------------------
    #
    # This previously proxied the whole of /api/ through, which meant every
    # read-mostly route was reachable from the internet. The API's own bearer-token
    # gate now covers the writes, but proxying the entire tree still leaves the
    # unauthenticated reads (org/repo listings, Plaky board and user rosters,
    # support-team members, LLM model list) and agent chat -- which spends LLM budget
    # on the server's key -- exposed to anyone who can resolve the hostname.
    #
    # Only the endpoints with a legitimate unauthenticated internet caller are
    # listed. Everything else falls through to the catch-all 403 below, so adding a
    # route to the app does NOT silently publish it: a new public endpoint has to be
    # added here on purpose.
    #
    #   POST /api/v1/webhooks/github        GitHub webhook delivery (HMAC-verified)
    #   POST /api/v1/assignment/pick-qa     Cloudflare Worker (bearer WORKER_INTERNAL_SECRET)
    #   GET  /api/v1/health                 health/monitoring
    #
    # Everything else is internal: call it over the docker network, or from the host
    # on 127.0.0.1:8090, rather than through the public vhost.

    location = /api/v1/webhooks/github {
        proxy_pass http://boardman_api/api/v1/webhooks/github;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GitHub webhook bodies can be a few hundred KB with a large diff payload.
        client_max_body_size 5m;
    }

    location = /api/v1/assignment/pick-qa {
        proxy_pass http://boardman_api/api/v1/assignment/pick-qa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny by default rather than proxying the whole API tree. This is a 403 at the
    # edge, not a 404, so it does not enumerate which routes exist upstream.
    location /api/ {
        default_type application/json;
        return 403 '{"ok":false,"error":"not exposed on the public vhost"}';
        access_log off;
    }
}
