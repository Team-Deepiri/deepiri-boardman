server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) with a short TTL, plus a variable in every
    # proxy_pass below, forces nginx to re-resolve "boardman" on each request instead
    # of caching whatever IP it had at startup/reload. Without this, redeploying the
    # boardman API container (which gets a new docker-internal IP every time it's
    # recreated) strands this nginx pointing at a dead IP until someone notices the
    # 502s and manually reloads it -- hit exactly this in production the first time
    # the API was redeployed after this nginx had already started.
    resolver 127.0.0.11 valid=10s;
    set $boardman_upstream http://boardman:8090;

    # A variable in proxy_pass disables nginx's normal "replace the matched location
    # prefix with the proxy_pass path" rewriting -- it always forwards the ORIGINAL,
    # unmodified request URI to whatever host/port the variable resolves to. Every
    # location below happens to want that exact behavior (the backend's own path
    # prefix already matches the location prefix 1:1), so proxy_pass takes no path
    # component at all here. Appending one (e.g. `$boardman_upstream/api/`) does NOT
    # do the rewrite a literal proxy_pass would -- it's simply concatenated onto the
    # host, and the real request URI gets silently dropped, truncating every request
    # under /api/ down to a bare /api/ that the app has no route for. Learned this
    # the hard way: shipped that exact bug, /api/v1/health 404'd in prod for a few
    # minutes until this comment's history was written.

    # SSE plain chat: disable buffering so tokens flush immediately (perceived latency).
    location /api/v1/agent/chat/stream {
        proxy_pass $boardman_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Agent chat + scans can exceed nginx defaults (60s) while Ollama/LangChain run.
    location /api/ {
        proxy_pass $boardman_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /docs {
        proxy_pass $boardman_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass $boardman_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
